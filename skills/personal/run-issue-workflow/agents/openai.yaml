interface:
  display_name: "Run Issue Workflow"
  short_description: "Run one Spec DAG with bounded writer waits"
  default_prompt: "Use $run-issue-workflow to reduce this exact Tracker Spec's immediate-upstream handoff to READY, INCOMPLETE, or UNKNOWN through repository-owned authority adapters, then run its concurrent Issue DAG with per-Run max_parallel, bounded target-writer waits, fresh post-wait reconciliation, and the automatic Pause, Resume, and Stop panel."
policy:
  allow_implicit_invocation: false
